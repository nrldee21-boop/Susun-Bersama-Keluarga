L.length=7;
function menu(){$('#game').hidden=true;$('#win').hidden=true;$('#menu').hidden=false;$('#lvs').innerHTML=L.map((l,i)=>`<button class="lv" data-i="${i}"><b>${l.i}</b>Tahap ${i+1}<br>${l.n}<small>${'⭐'.repeat(stars[i]||0)}</small></button>`).join('');document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{startMus();load(+b.dataset.i)})}
const say=t=>$('#msg').textContent=t;
function slot(w,fs,ok,need,h,ht){const d=document.createElement('div');d.className='slot';d.style.cssText=`width:${w}px;height:${ht||w}px;font-size:${fs}px`;d.innerHTML=h||'';d._s={ok,need,got:0};slots.push(d);$('#board').append(d);return d}
function tok(t,h,w,fs,ht){const d=document.createElement('div');d.className='tok';d.style.cssText=`width:${w}px;height:${ht||w}px;font-size:${fs}px`;d.innerHTML=h;d._t=t;d.onpointerdown=e=>drag(e,d);return d}
function drag(e,el){if(el.dataset.d)return;e.preventDefault();fx('pick');const r=el.getBoundingClientRect(),c=el.cloneNode(true);c.style.cssText+=`;position:fixed;left:${r.left}px;top:${r.top}px;pointer-events:none;z-index:99;margin:0;transform:scale(1.08)`;document.body.append(c);el.style.opacity=.3;const ox=e.clientX-r.left,oy=e.clientY-r.top;
const mv=v=>{c.style.left=v.clientX-ox+'px';c.style.top=v.clientY-oy+'px'};
const up=v=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);c.remove();el.style.opacity='';if(v.type!='pointerup')return;const x=v.clientX-ox+r.width/2,y=v.clientY-oy+r.height/2,s=document.elementsFromPoint(x,y).find(n=>n._s);if(s)place(s,el)};
addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
function place(sl,el){const s=sl._s,t=el._t;if(s.got>=s.need)return;
if(!s.ok(t)){err++;fx('bad');sl.classList.add('shake');setTimeout(()=>sl.classList.remove('shake'),400);say('Cuba lagi ya! 💪');return}
s.got++;fx('ok');el.style.visibility='hidden';el.dataset.d=1;say(pick(PR));
if(s.need==1){sl.innerHTML=el.innerHTML;sl.classList.add('full')}else{const m=document.createElement('span');m.textContent=el.textContent;m.style.fontSize=el.style.fontSize;m.style.lineHeight=1;m.style.margin='2px 6px';sl.querySelector('.in').append(m)}
if(slots.every(x=>x._s.got>=x._s.need))setTimeout(win,600)}
function win(){const s=err<=1?3:err<=3?2:1;stars[cur]=Math.max(stars[cur]||0,s);fx('win');$('#stars').textContent='⭐'.repeat(s);$('#wt').textContent='Tahniah! Keluarga bangga dengan anda! 🎉';$('#nx').hidden=cur>=L.length-1;$('#win').hidden=false}
$('#nx').onclick=()=>load(cur+1);$('#mn').onclick=menu;
function load(i){cur=i;err=0;slots=[];const l=L[i];$('#menu').hidden=true;$('#win').hidden=true;$('#game').hidden=false;$('#ttl').textContent=`Tahap ${i+1}: ${l.n}`;say(l.say);
const b=$('#board'),t=$('#tray'),t0=$('#tray0');b.innerHTML=t.innerHTML=t0.innerHTML='';t.className='';b.className='';b.style.cssText='';$('#stage').className=l.d=='v'&&!l.it?'v':'';b.classList.toggle('col',l.d=='v'&&!!l.it);let T=[];
if(l.m=='match'){sh(E).slice(0,3).forEach(e=>{const k=pick([0,1,2]),px=S(k);slot(px*F,px,t=>t.e==e&&t.k==k,1,`<i class="gh">${e}</i>`);T.push({e,k},{e,k:(k+1+(Math.random()*2|0))%3})});T=sh(T).map(o=>tok(o,o.e,S(o.k)*F,S(o.k)))}
else if(l.m=='bin'){b.style.flexDirection='column';b.style.alignItems='stretch';const es=sh(E);[['Besar',2],['Kecil',0]].forEach(([n,k])=>{const d=slot(0,16,t=>t.k==k,3,`<b>${n}</b><div class="in"></div>`);d.className='slot bin';d.style.width='100%';d.style.height='';d.style.flex='none'});es.forEach((e,j)=>{const k=j<3?2:0;T.push(tok({e,k},e,S(k)*F,S(k)))});T=sh(T)}
else if(l.m=='ord'){const e=pick(E),u=l.c==3?[0,2,3]:[0,1,2,3],it=l.it,C=l.col,D=k=>{const px=S(k);return it=='cloth'?[px*1.5,px*.63]:it=='book'?[40*K,px*1.4]:[px*F,px*F]},H=(k,o)=>it?item(it,C[k],o):e;u.forEach((_,j)=>{const k=l.asc?u[j]:u[u.length-1-j],d=D(k);slot(d[0],S(k),t=>t.k==k,1,it?H(k,.3):`<i class="gh">${e}</i>`,d[1])});T=sh(u).map(k=>{const d=D(k);return tok({k},H(k,1),d[0],S(k),d[1])})}
else if(l.m=='org'){$('#stage').className='room';t.className='floor';b.className='cab';l.sh.forEach((s,i)=>{const k=s.k??1,fs=(s.k==null?46:SZ[k]*.9)*K,d=slot(0,12,x=>x.s==i,s.it.length,`<b>${s.n}</b><div class="in"></div>`);d.className='slot cub';d.style.cssText=`grid-column:span ${s.cs}`;s.it.forEach(e=>{const o=tok({s:i},e,fs*1.1,fs);o.style.transform=`rotate(${Math.random()*28-14|0}deg)`;o.style.margin=`${Math.random()*8|0}px`;T.push(o)})});T=sh(T);const h=Math.ceil(T.length/2);T.slice(0,h).forEach(x=>t0.append(x));T=T.slice(h)}else if(l.m=='cut'){const ty=['spoon','spoon','fork','fork','fork'],w=38*K,h=w*2.6;ty.forEach(e=>slot(w,16,t=>t.e==e,1,item(e,'#9aa0a8',.3),h));T=sh(ty).map(e=>tok({e},item(e,'#b8bcc4',1),w,16,h))}else{const g=l.g,W=Math.min(innerWidth-50,320),C=W/g,P=PIC[l.p],cell=n=>`<svg viewBox="${n%g*240/g} ${(n/g|0)*240/g} ${240/g} ${240/g}" width="${C}" height="${C}">${P}</svg>`;b.className='grid';b.style.gridTemplateColumns=`repeat(${g},${C}px)`;
for(let n=0;n<g*g;n++){if(l.ms.includes(n))slot(C,20,t=>t.n==n,1,'<i class="gh">❔</i>');else{const d=document.createElement('div');d.className='cell';d.innerHTML=cell(n);b.append(d)}}
T=sh(l.ms).map(n=>tok({n},cell(n),C,20))}
T.forEach(x=>t.append(x))}
menu();
